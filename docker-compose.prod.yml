services:
  backend:
    container_name: urbanfit_backend_prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - .env
    depends_on:
      - db
    command: >
      sh -c "gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 config.wsgi:application"
    networks:
      - urbanfit_network

  db:
    image: postgres:16
    container_name: urbanfit_db_prod
    restart: unless-stopped
    volumes:
      - urbanfit_postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    networks:
      - urbanfit_network

volumes:
  urbanfit_postgres_data:

networks:
  urbanfit_network:
    name: urbanfit_network