services:
  backend:
    container_name: urbanfit_backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    volumes:
      - .:/urbanfit
    env_file:
      - .env
    depends_on:
      - db
    command: python manage.py runserver 0.0.0.0:8000

  db:
    image: postgres:16
    container_name: urbanfit_db
    ports:
      - "5440:5432"
    volumes:
      - urbanfit_db:/var/lib/postgresql/data/
    env_file:
      - .env

volumes:
  urbanfit_db: